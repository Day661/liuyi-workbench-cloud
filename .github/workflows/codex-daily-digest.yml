name: Codex Daily Digest

on:
  schedule:
    # 21:00 Asia/Hong_Kong. GitHub may delay scheduled runs by a few minutes.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send even if this digest was already sent"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: codex-daily-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate script
        run: node --check scripts/send-codex-daily-digest.mjs

      - name: Install runtime dependencies
        run: npm install --omit=dev

      - name: Send Codex daily digest
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          WECOM_BOT_ID: ${{ secrets.WECOM_BOT_ID }}
          WECOM_BOT_SECRET: ${{ secrets.WECOM_BOT_SECRET }}
          WECOM_TARGET_CHAT_ID: ${{ secrets.WECOM_TARGET_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
        run: node scripts/send-codex-daily-digest.mjs

      - name: Commit digest status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codex-daily-digest-status.json
          git diff --cached --quiet || git commit -m "chore: update codex daily digest status"
          git push
